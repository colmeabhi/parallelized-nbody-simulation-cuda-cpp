<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="'Virgil','Segoe Print','Bradley Hand','Comic Sans MS','Chalkboard SE','Marker Felt',cursive">
<defs>
<filter id="rough" filterUnits="userSpaceOnUse" x="0" y="0" width="900" height="330"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3.2"/></filter>
<marker id="arr" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrr" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#e03131" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>.sk{filter:url(#rough)}</style>
</defs>
<rect x="1" y="1" width="898" height="328" rx="14" fill="#ffffff" stroke="#dee2e6"/>
<text x="450" y="42" font-size="26" text-anchor="middle" font-weight="bold" fill="#1e1e1e">How the code is organised</text>
<rect class="sk" x="40" y="80" width="230" height="150" rx="10" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<text x="155.0" y="129.4" font-size="16" text-anchor="middle" font-weight="bold" fill="#1e1e1e">src/</text>
<text x="155.0" y="150.20000000000002" font-size="16" text-anchor="middle" font-weight="normal" fill="#1e1e1e">the simulation</text>
<text x="155.0" y="171.0" font-size="16" text-anchor="middle" font-weight="normal" fill="#1e1e1e">galaxy, CPU and GPU</text>
<text x="155.0" y="191.8" font-size="16" text-anchor="middle" font-weight="normal" fill="#1e1e1e">force + time step</text>
<rect class="sk" x="335" y="80" width="230" height="150" rx="10" fill="#ffec99" stroke="#1e1e1e" stroke-width="2"/>
<text x="450.0" y="129.4" font-size="16" text-anchor="middle" font-weight="bold" fill="#1e1e1e">bench/</text>
<text x="450.0" y="150.20000000000002" font-size="16" text-anchor="middle" font-weight="normal" fill="#1e1e1e">the stopwatch</text>
<text x="450.0" y="171.0" font-size="16" text-anchor="middle" font-weight="normal" fill="#1e1e1e">runs src/ and times it,</text>
<text x="450.0" y="191.8" font-size="16" text-anchor="middle" font-weight="normal" fill="#1e1e1e">checks energy</text>
<rect class="sk" x="630" y="80" width="230" height="150" rx="10" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<text x="745.0" y="129.4" font-size="16" text-anchor="middle" font-weight="bold" fill="#1e1e1e">plots/</text>
<text x="745.0" y="150.20000000000002" font-size="16" text-anchor="middle" font-weight="normal" fill="#1e1e1e">the pictures</text>
<text x="745.0" y="171.0" font-size="16" text-anchor="middle" font-weight="normal" fill="#1e1e1e">charts, table and</text>
<text x="745.0" y="191.8" font-size="16" text-anchor="middle" font-weight="normal" fill="#1e1e1e">galaxy animation</text>
<line class="sk" x1="274" y1="155" x2="331" y2="155" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/>
<line class="sk" x1="569" y1="155" x2="626" y2="155" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="302" y="140" font-size="13" text-anchor="middle" font-weight="normal" fill="#1e1e1e">used by</text>
<text x="597" y="140" font-size="13" text-anchor="middle" font-weight="normal" fill="#1e1e1e">CSV</text>
<rect class="sk" x="335" y="262" width="525" height="44" rx="10" fill="#e9ecef" stroke="#1e1e1e" stroke-width="2"/>
<text x="597.5" y="289.6" font-size="16" text-anchor="middle" font-weight="normal" fill="#1e1e1e">results/   numbers (.csv) and charts (.png)</text>
<line class="sk" x1="450" y1="234" x2="450" y2="258" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/>
<line class="sk" x1="745" y1="234" x2="745" y2="258" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/>
</svg>
