<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="'Virgil','Segoe Print','Bradley Hand','Comic Sans MS','Chalkboard SE','Marker Felt',cursive">
<defs>
<filter id="rough" filterUnits="userSpaceOnUse" x="0" y="0" width="900" height="470"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3.2"/></filter>
<marker id="arr" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrr" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#e03131" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>.sk{filter:url(#rough)}</style>
</defs>
<rect x="1" y="1" width="898" height="468" rx="14" fill="#ffffff" stroke="#dee2e6"/>
<text x="450" y="42" font-size="24" text-anchor="middle" font-weight="bold" fill="#1e1e1e">The bug: reading positions while they are being changed</text>
<rect class="sk" x="30" y="62" width="840" height="180" rx="10" fill="#fff5f5" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="8 6"/>
<text x="50" y="90" font-size="18" text-anchor="start" font-weight="bold" fill="#e03131">BEFORE: one kernel does everything</text>
<text x="60" y="135" font-size="17" text-anchor="start" font-weight="normal" fill="#1e1e1e">block 0</text>
<rect class="sk" x="140" y="110" width="300" height="40" rx="10" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<text x="290.0" y="135.25" font-size="15" text-anchor="middle" font-weight="normal" fill="#1e1e1e">read all positions, add up pulls</text>
<rect class="sk" x="446" y="110" width="190" height="40" rx="10" fill="#ffc9c9" stroke="#1e1e1e" stroke-width="2"/>
<text x="541.0" y="135.25" font-size="15" text-anchor="middle" font-weight="normal" fill="#1e1e1e">write new positions</text>
<text x="60" y="190" font-size="17" text-anchor="start" font-weight="normal" fill="#1e1e1e">block 7</text>
<rect class="sk" x="230" y="165" width="400" height="40" rx="10" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<text x="430.0" y="190.25" font-size="15" text-anchor="middle" font-weight="normal" fill="#1e1e1e">read all positions, add up pulls  (started later)</text>
<rect class="sk" x="636" y="165" width="190" height="40" rx="10" fill="#ffc9c9" stroke="#1e1e1e" stroke-width="2"/>
<text x="731.0" y="190.25" font-size="15" text-anchor="middle" font-weight="normal" fill="#1e1e1e">write new positions</text>
<line class="sk" x1="540" y1="152" x2="540" y2="163" stroke="#e03131" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrr)"/>
<text x="450" y="230" font-size="15" text-anchor="middle" font-weight="normal" fill="#e03131">block 7 is still reading while block 0 overwrites: it sees a mix of old and new positions</text>
<rect class="sk" x="30" y="262" width="840" height="190" rx="10" fill="#f3fbf4" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="8 6"/>
<text x="50" y="290" font-size="18" text-anchor="start" font-weight="bold" fill="#2f9e44">AFTER: three small kernels, one after another</text>
<rect class="sk" x="60" y="315" width="240" height="70" rx="10" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<text x="180.0" y="335.75" font-size="15" text-anchor="middle" font-weight="bold" fill="#1e1e1e">accel kernel</text>
<text x="180.0" y="355.25" font-size="15" text-anchor="middle" font-weight="normal" fill="#1e1e1e">reads all positions</text>
<text x="180.0" y="374.75" font-size="15" text-anchor="middle" font-weight="normal" fill="#1e1e1e">writes only acc[i]</text>
<rect class="sk" x="350" y="315" width="200" height="70" rx="10" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<text x="450.0" y="345.5" font-size="15" text-anchor="middle" font-weight="bold" fill="#1e1e1e">kick kernel</text>
<text x="450.0" y="365.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#1e1e1e">vel[i] += acc[i] * dt</text>
<rect class="sk" x="600" y="315" width="220" height="70" rx="10" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<text x="710.0" y="345.5" font-size="15" text-anchor="middle" font-weight="bold" fill="#1e1e1e">drift kernel</text>
<text x="710.0" y="365.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#1e1e1e">pos[i] += vel[i] * dt</text>
<line class="sk" x1="304" y1="350" x2="346" y2="350" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/>
<line class="sk" x1="554" y1="350" x2="596" y2="350" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/>
<line class="sk" x1="325" y1="305" x2="325" y2="395" stroke="#868e96" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 6"/>
<line class="sk" x1="575" y1="305" x2="575" y2="395" stroke="#868e96" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 6"/>
<text x="450" y="425" font-size="15" text-anchor="middle" font-weight="normal" fill="#1e1e1e">a kernel only starts when the one before it has finished, so positions never change mid-read</text>
</svg>
